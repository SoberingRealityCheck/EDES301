# Window Device configuration

# Buttons
LEFT_BUTTON_PIN   : "P1_2"
RIGHT_BUTTON_PIN  : "P1_8"
SELECT_BUTTON_PIN : "P1_6"
BACK_BUTTON_PIN   : "P1_4"

# LED matrix GPIO pins (Adafruit 32x32 panel)
DISPLAY_GPIO_PINS : [
  "P2_6", "P2_2", "P1_20", "P2_3", 
  "P2_24", "P2_22", "P2_10", "P2_1", 
  "P2_4", "P1_34", "P2_33", "P2_18", "P2_8"]

# Buzzer — hardware PWM pin for HCW-KC1206 passive piezo
BUZZER_PIN : "P1_12" 

# IMU (I2C) — MPU-6050 default address
IMU_I2C_BUS     : 1
IMU_I2C_ADDRESS : 0x68
